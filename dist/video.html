<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>跨境账证侦探｜演示视频</title>
  <style>
    :root { color-scheme: dark; font-family: "Microsoft YaHei", system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #061817; color: #f8f5ed; }
    main { width: min(1180px, 94vw); padding: 40px 0; }
    header { display: flex; align-items: end; justify-content: space-between; gap: 24px; margin-bottom: 22px; }
    small { color: #dfff72; letter-spacing: .15em; font-weight: 800; }
    h1 { margin: 8px 0 0; font-size: clamp(30px, 4vw, 54px); }
    a { color: #dfff72; text-decoration: none; }
    video { display: block; width: 100%; border: 1px solid rgba(223,255,114,.28); border-radius: 22px; background: #020b0a; box-shadow: 0 26px 80px rgba(0,0,0,.42); }
    p { color: #bcd0cb; line-height: 1.75; }
    @media (max-width: 720px) { header { align-items: start; flex-direction: column; } }
  </style>
</head>
<body>
  <main>
    <header>
      <div><small>LEDGER EVIDENCE LAB</small><h1>跨境账证侦探</h1></div>
      <a href="./">进入在线演示 →</a>
    </header>
    <video controls preload="metadata" poster="./media/video-poster.png">
      <source src="./media/demo.mp4" type="video/mp4">
      当前浏览器不支持 MP4 播放，请下载视频后观看。
    </video>
    <p>77 秒最终版：真实在线界面、字幕与轻提示音，无语音；公开包只含合成数据和脱敏展示。</p>
  </main>
</body>
</html>
